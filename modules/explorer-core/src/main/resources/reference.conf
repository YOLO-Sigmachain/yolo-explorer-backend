# YOLO chain parameters shared by the grabber, the API and the mempool tracker. This file is the one place they
# are set; a service config may override them under `protocol`.
protocol {
  # Voting epoch length (node ergo.chain.voting.votingLength). 128 on the YOLO testnet and mainnet, which inherit it
  # from the node's testnet.conf (yolo-testnet.conf does not override it). Ergo mainnet uses 1024.
  voting-epoch-length = 128

  yolo {
    # Value of the genesis emission box, nanocoins (node ergo.chain.yolo.emission.genesisValue): 177,291,250 YOLO
    genesis-value = 177291250000000000
    # Share of each emission spend paid to the treasury and to the LP fund, percent (emission.es treasuryReward,
    # lpReward). The miner gets the rest. Must match the deployed emission contract.
    treasury-percent = 10
    lp-percent = 5
  }
}
